# Chaque nuit, les notes IMDb des épisodes des séries d'animation, un fichier
# par série, publiées sur la branche « donnees » (voir generer.mjs).
#
# La branche est remplacée à chaque fois, sans historique : les votes bougent
# tous les jours, et garder chaque version ferait grossir le dépôt sans fin.
name: Notes IMDb

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Lire les jeux de données d'IMDb
        run: node generer.mjs donnees .cache
      - name: Publier sur la branche donnees
        env:
          JETON: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp README.md donnees/README.md
          cd donnees
          git init -q -b donnees
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Notes IMDb du $(date -u +%F)"
          git push -q -f "https://x-access-token:${JETON}@github.com/${GITHUB_REPOSITORY}.git" donnees
